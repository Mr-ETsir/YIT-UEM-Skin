; YIT & UEM 联合皮肤站 - PHP-FPM 池配置示例
; 放入 /etc/php/8.3/fpm/pool.d/bss.conf 后重启 php-fpm
; 需与 nginx.conf.example 中的 fastcgi_pass 保持一致

[bss]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; 材质上传需要
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M